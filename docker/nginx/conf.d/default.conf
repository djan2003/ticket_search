# HTTP server: routes the landing (Next.js) and the Laravel API.
# Works both locally (http://localhost) and in production (also serves ACME).
server {
    listen 80;
    server_name _;

    root /var/www/public;

    # Let's Encrypt webroot challenge (used by the certbot service)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Laravel API -> php-fpm
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Everything else -> Next.js landing
    location / {
        proxy_pass http://landing:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
