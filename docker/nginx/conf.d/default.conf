# HTTP server: serves the API and handles Let's Encrypt ACME challenges.
# Works both locally (http://localhost) and in production.
server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;

    # Let's Encrypt webroot challenge (used by the certbot service)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
