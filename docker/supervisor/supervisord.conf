[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:scheduler]
process_name=%(program_name)s
command=sh -c 'while true; do php /var/www/artisan schedule:run --verbose --no-interaction & sleep 60; done'
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/scheduler.log
stopwaitsecs=3600

[program:telegram]
process_name=%(program_name)s
command=php /var/www/artisan telegram:listen
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/storage/logs/telegram.log
stopwaitsecs=10
