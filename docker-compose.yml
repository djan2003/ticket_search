version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_search_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - flight-search-network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-flight_search}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

  web:
    image: nginx:alpine
    container_name: flight_search_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - app
      - landing
      - umami
    networks:
      - flight-search-network

  landing:
    build:
      context: ./landing
      args:
        NEXT_PUBLIC_SITE_URL: ${LANDING_SITE_URL:-https://flykend.com}
        NEXT_PUBLIC_TELEGRAM_URL: ${LANDING_TELEGRAM_URL:-https://t.me/cheap_flights_search}
        NEXT_PUBLIC_UMAMI_SRC: ${LANDING_UMAMI_SRC:-https://flykend.com/stats/script.js}
        NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${LANDING_UMAMI_WEBSITE_ID:-}
    container_name: flight_search_landing
    restart: unless-stopped
    environment:
      - API_FEED_URL=http://web/api/feed
    depends_on:
      - app
    networks:
      - flight-search-network

  certbot:
    image: certbot/certbot
    container_name: flight_search_certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - flight-search-network

  # Self-hosted web analytics, served behind nginx at /stats (BASE_PATH).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: flight_search_umami
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secret}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-please_change_this_secret}
      BASE_PATH: /stats
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - flight-search-network

  umami-db:
    image: postgres:16-alpine
    container_name: flight_search_umami_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami_secret}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - flight-search-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.0
    container_name: flight_search_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-flight_search}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flight-search-network
    ports:
      - "3307:3306"

networks:
  flight-search-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-webroot:
    driver: local
  umami-db-data:
    driver: local
