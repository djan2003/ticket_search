version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_search_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - flight-search-network
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-flight_search}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

  mysql:
    image: mysql:8.0
    container_name: flight_search_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-flight_search}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - flight-search-network
    ports:
      - "3307:3306"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight_search_scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - flight-search-network
    depends_on:
      - mysql
      - app
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-flight_search}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    command: >
      sh -c "while ! nc -z mysql 3306; do sleep 1; done &&
             /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"

networks:
  flight-search-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
